<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Saspolo Hotel — Admin</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<style>
  :root {
    --forest: #1e2f3f; --forest-2: #2a3f52; --amber: #c68544; --amber-2: #dba26a;
    --cream: #faf9f6; --stone: #e5e1d8; --ink: #2b2b28; --ok: #2e7d4f; --err: #b3402e;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--cream); color: var(--ink); }
  .topbar { background: var(--forest); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .topbar img { height: 30px; }
  .topbar h1 { font-size: 17px; font-weight: 600; flex: 1; }
  .topbar .who { font-size: 13px; opacity: .8; }
  .topbar button { background: none; border: 1px solid rgba(255,255,255,.4); color: #fff; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 80px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .tabs button { border: 1px solid var(--stone); background: #fff; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink); }
  .tabs button.active { background: var(--forest); border-color: var(--forest); color: #fff; }
  .panel { background: #fff; border: 1px solid var(--stone); border-radius: 12px; padding: 20px; }
  .panel h2 { font-size: 17px; margin-bottom: 4px; }
  .hint { font-size: 13px; color: #6b6b64; margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  input[type=text], input[type=password], input[type=url], select, textarea {
    width: 100%; padding: 9px 10px; border: 1px solid var(--stone); border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff;
  }
  textarea { min-height: 70px; resize: vertical; }
  .btn { display: inline-block; background: var(--amber); color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 14px; }
  .btn.secondary { background: #fff; color: var(--ink); border: 1px solid var(--stone); }
  .btn.danger { background: var(--err); }
  .btn:disabled { opacity: .5; cursor: default; }
  .item { border: 1px solid var(--stone); border-radius: 10px; padding: 12px; margin-bottom: 12px; display: flex; gap: 12px; align-items: flex-start; }
  .item .thumb { width: 90px; height: 68px; object-fit: cover; border-radius: 6px; background: var(--stone); flex-shrink: 0; }
  .item .fields { flex: 1; min-width: 0; }
  .item .fields label { margin-top: 6px; }
  .item .rowbtns { display: flex; flex-direction: column; gap: 4px; }
  .item .rowbtns button { border: 1px solid var(--stone); background: #fff; border-radius: 6px; width: 30px; height: 28px; cursor: pointer; font-size: 13px; }
  .status { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 20px; font-size: 14px; font-weight: 600; display: none; }
  .status.ok { display: block; background: var(--ok); color: #fff; }
  .status.err { display: block; background: var(--err); color: #fff; }
  .status.busy { display: block; background: var(--forest-2); color: #fff; }
  .login-card { max-width: 420px; margin: 60px auto; background: #fff; border: 1px solid var(--stone); border-radius: 14px; padding: 28px; }
  .login-card h2 { margin-bottom: 6px; }
  .pill { display: inline-block; font-size: 12px; background: var(--stone); border-radius: 99px; padding: 2px 10px; margin-left: 6px; }
  .preview-box { background: var(--cream); border: 1px dashed var(--stone); border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 13px; white-space: pre-wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } .item { flex-wrap: wrap; } }
</style>
</head>
<body>

<div id="login-view">
  <div class="login-card">
    <img src="assets/images/logo.png" alt="" style="height:48px; margin-bottom:12px;">
    <h2>Saspolo Hotel Admin</h2>
    <p class="hint">Sign in to edit the website. Changes go live in about 2 minutes.</p>
    <label for="in-gateway">Gateway address <span class="pill">one-time setup</span></label>
    <input type="url" id="in-gateway" placeholder="https://....workers.dev">
    <label for="in-name">Your name (shown in the change history)</label>
    <input type="text" id="in-name" placeholder="e.g. Mazahir">
    <label for="in-pass">Admin password</label>
    <input type="password" id="in-pass">
    <button class="btn" id="btn-login">Sign in</button>
    <p class="hint" id="login-msg" style="margin-top:10px;"></p>
  </div>
</div>

<div id="app-view" style="display:none;">
  <div class="topbar">
    <img src="assets/images/logo.png" alt="">
    <h1>Saspolo Hotel — Site Admin</h1>
    <span class="who" id="who"></span>
    <button id="btn-logout">Sign out</button>
  </div>
  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<div class="status" id="status"></div>

<script>
(function () {
  "use strict";

  /* ---------- gateway plumbing ---------- */
  const store = {
    get gateway() { return localStorage.getItem("sa_gateway") || ""; },
    set gateway(v) { localStorage.setItem("sa_gateway", v); },
    get name() { return localStorage.getItem("sa_name") || ""; },
    set name(v) { localStorage.setItem("sa_name", v); },
    get pass() { return sessionStorage.getItem("sa_pass") || ""; },
    set pass(v) { sessionStorage.setItem("sa_pass", v); },
  };

  function b64encodeText(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }
  function b64decodeText(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  async function gw(method, path, body) {
    const url = store.gateway.replace(/\/$/, "") + (path ? "/?path=" + encodeURIComponent(path) : "/ping");
    const res = await fetch(url, {
      method,
      headers: { "X-Admin-Password": store.pass, ...(body ? { "Content-Type": "application/json" } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok && !(res.status === 404 && data.notFound)) {
      throw new Error(data.error || ("Request failed (" + res.status + ")"));
    }
    return data;
  }
  const readFile = (path) => gw("GET", path);
  const writeFile = (path, contentBase64, sha, message) =>
    gw("PUT", path, { contentBase64, sha, message, author: store.name });

  async function readTextFile(path) {
    const r = await readFile(path);
    return { text: b64decodeText(r.contentBase64), sha: r.sha };
  }
  const writeTextFile = (path, text, sha, message) => writeFile(path, b64encodeText(text), sha, message);

  /* parse "window.X = ..." data files without touching the real window */
  function parseDataFile(text) {
    const fake = {};
    new Function("window", text)(fake);
    return fake;
  }
  const serializeDataFile = (varName, value) =>
    "window." + varName + " = " + JSON.stringify(value, null, 2) + ";\n";

  /* ---------- status bar ---------- */
  const statusEl = document.getElementById("status");
  let statusTimer;
  function status(kind, msg) {
    clearTimeout(statusTimer);
    statusEl.className = "status " + kind;
    statusEl.textContent = msg;
    if (kind !== "busy") statusTimer = setTimeout(() => (statusEl.className = "status"), 6000);
  }

  /* ---------- image compression ---------- */
  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality).split(",")[1]);
        URL.revokeObjectURL(img.src);
      };
      img.onerror = () => reject(new Error("Could not read that image file"));
      img.src = URL.createObjectURL(file);
    });
  }

  /* ---------- login ---------- */
  const loginView = document.getElementById("login-view");
  const appView = document.getElementById("app-view");

  document.getElementById("in-gateway").value = store.gateway;
  document.getElementById("in-name").value = store.name;

  document.getElementById("btn-login").addEventListener("click", async () => {
    const gwUrl = document.getElementById("in-gateway").value.trim();
    const name = document.getElementById("in-name").value.trim();
    const pass = document.getElementById("in-pass").value;
    const msg = document.getElementById("login-msg");
    if (!gwUrl || !pass) { msg.textContent = "Gateway address and password are both needed."; return; }
    store.gateway = gwUrl; store.name = name; store.pass = pass;
    msg.textContent = "Checking…";
    try {
      await gw("GET", null);
      msg.textContent = "";
      showApp();
    } catch (e) {
      msg.textContent = "Could not sign in: " + e.message;
    }
  });

  document.getElementById("btn-logout").addEventListener("click", () => {
    store.pass = "";
    location.reload();
  });

  function showApp() {
    loginView.style.display = "none";
    appView.style.display = "";
    document.getElementById("who").textContent = store.name ? "Signed in as " + store.name : "";
    openTab("photos");
  }

  /* ---------- tabs ---------- */
  const TABS = [
    ["photos", "Photos"],
    ["special", "Logo, Hero & Backgrounds"],
    ["rooms", "Rooms"],
    ["reviews", "Reviews"],
    ["text", "Website Text"],
    ["contact", "Contact Info"],
  ];
  const tabsEl = document.getElementById("tabs");
  const panelEl = document.getElementById("panel");
  TABS.forEach(([id, label]) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.dataset.tab = id;
    b.addEventListener("click", () => openTab(id));
    tabsEl.appendChild(b);
  });
  function openTab(id) {
    tabsEl.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.tab === id));
    panelEl.innerHTML = "<p class='hint'>Loading…</p>";
    ({ photos: renderPhotos, special: renderSpecial, rooms: renderRooms, reviews: renderReviews, text: renderText, contact: renderContact })[id]().catch((e) =>
      (panelEl.innerHTML = "<p class='hint'>Could not load: " + e.message + "</p>")
    );
  }

  const el = (html) => { const d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; };

  /* ================= PHOTOS ================= */
  const GALLERY_PATH = "assets/js/data/gallery-data.js";

  async function renderPhotos() {
    const { text, sha } = await readTextFile(GALLERY_PATH);
    const data = parseDataFile(text).HR_GALLERY;

    panelEl.innerHTML = "";
    panelEl.appendChild(el("<h2>Gallery photos</h2>"));
    panelEl.appendChild(el("<p class='hint'>Add, remove, reorder, and re-caption photos. New photos are automatically shrunk to web size. Thumbnails show the live site's current photos, so a photo you just added may show as blank until the site republishes (~2 min).</p>"));

    const sel = el("<select></select>");
    data.forEach((cat, i) => sel.appendChild(el("<option value='" + i + "'>" + cat.label + "</option>")));
    panelEl.appendChild(el("<label>Category</label>"));
    panelEl.appendChild(sel);

    const list = el("<div style='margin-top:16px;'></div>");
    panelEl.appendChild(list);

    const addWrap = el("<div style='margin-top:8px;'></div>");
    const fileIn = el("<input type='file' accept='image/*' style='display:none;'>");
    const addBtn = el("<button class='btn secondary'>+ Add a photo</button>");
    addBtn.addEventListener("click", () => fileIn.click());
    addWrap.appendChild(fileIn); addWrap.appendChild(addBtn);
    panelEl.appendChild(addWrap);

    const saveBtn = el("<button class='btn'>Save photo changes</button>");
    panelEl.appendChild(saveBtn);

    const pendingUploads = []; // {path, base64}

    function draw() {
      const cat = data[+sel.value];
      list.innerHTML = "";
      cat.images.forEach((img, i) => {
        const row = el(
          "<div class='item'>" +
            "<img class='thumb' loading='lazy'>" +
            "<div class='fields'>" +
              "<label>Description (for Google &amp; screen readers)</label><input type='text' class='f-alt'>" +
              (cat.category === "restaurant" ? "<label>Visible caption (restaurant name)</label><input type='text' class='f-cap'>" : "") +
            "</div>" +
            "<div class='rowbtns'>" +
              "<button title='Move up'>↑</button><button title='Move down'>↓</button><button title='Remove'>✕</button>" +
            "</div>" +
          "</div>"
        );
        const local = pendingUploads.find((p) => p.path === img.src);
        row.querySelector(".thumb").src = local ? "data:image/jpeg;base64," + local.base64 : img.src;
        row.querySelector(".f-alt").value = img.alt || "";
        row.querySelector(".f-alt").addEventListener("input", (e) => (img.alt = e.target.value));
        const cap = row.querySelector(".f-cap");
        if (cap) {
          cap.value = img.caption || "";
          cap.addEventListener("input", (e) => (img.caption = e.target.value));
        }
        const [up, down, del] = row.querySelectorAll(".rowbtns button");
        up.addEventListener("click", () => { if (i > 0) { cat.images.splice(i - 1, 0, cat.images.splice(i, 1)[0]); draw(); } });
        down.addEventListener("click", () => { if (i < cat.images.length - 1) { cat.images.splice(i + 1, 0, cat.images.splice(i, 1)[0]); draw(); } });
        del.addEventListener("click", () => { if (confirm("Remove this photo from the gallery?")) { cat.images.splice(i, 1); draw(); } });
        list.appendChild(row);
      });
    }
    sel.addEventListener("change", draw);
    draw();

    fileIn.addEventListener("change", async () => {
      const file = fileIn.files[0];
      if (!file) return;
      status("busy", "Preparing photo…");
      try {
        const base64 = await compressImage(file, 1600, 0.82);
        const cat = data[+sel.value];
        const path = "assets/images/gallery/" + cat.category + "/" + cat.category + "-a" + Date.now() + ".jpg";
        pendingUploads.push({ path, base64 });
        cat.images.push({ src: path, alt: "", ...(cat.category === "restaurant" ? { caption: "" } : {}) });
        draw();
        status("ok", "Photo added below — write its description, then press Save.");
      } catch (e) { status("err", e.message); }
      fileIn.value = "";
    });

    saveBtn.addEventListener("click", async () => {
      saveBtn.disabled = true;
      try {
        for (let i = 0; i < pendingUploads.length; i++) {
          status("busy", "Uploading photo " + (i + 1) + " of " + pendingUploads.length + "…");
          await writeFile(pendingUploads[i].path, pendingUploads[i].base64, null, "Add gallery photo");
        }
        status("busy", "Saving gallery…");
        await writeTextFile(GALLERY_PATH, serializeDataFile("HR_GALLERY", data), sha, "Update gallery");
        status("ok", "Saved! The site updates itself in about 2 minutes.");
        setTimeout(() => openTab("photos"), 1200);
      } catch (e) {
        status("err", "Save failed: " + e.message);
        saveBtn.disabled = false;
      }
    });
  }

  /* ---------- logo processing (trim + white -> transparent + icons) ---------- */
  function processLogo(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(img.src);
        const c = document.createElement("canvas");
        c.width = img.width; c.height = img.height;
        const ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const d = ctx.getImageData(0, 0, c.width, c.height);
        const px = d.data;
        // near-white -> transparent (graduated at the edges)
        for (let i = 0; i < px.length; i += 4) {
          const w = Math.min(px[i], px[i + 1], px[i + 2]);
          if (px[i + 3] > 0) {
            if (w >= 250) px[i + 3] = 0;
            else if (w >= 235) px[i + 3] = Math.min(px[i + 3], Math.round((255 * (250 - w)) / 15));
          }
        }
        // bounding box of visible pixels
        let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
        for (let y = 0; y < c.height; y++) {
          for (let x = 0; x < c.width; x++) {
            if (px[(y * c.width + x) * 4 + 3] > 8) {
              if (x < minX) minX = x; if (x > maxX) maxX = x;
              if (y < minY) minY = y; if (y > maxY) maxY = y;
            }
          }
        }
        if (maxX < 0) { reject(new Error("That image looks empty after removing the white background.")); return; }
        ctx.putImageData(d, 0, 0);
        const pad = Math.round(Math.max(maxX - minX, maxY - minY) * 0.04);
        minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
        maxX = Math.min(c.width - 1, maxX + pad); maxY = Math.min(c.height - 1, maxY + pad);
        const w = maxX - minX + 1, h = maxY - minY + 1;

        function fit(destW, destH, maxContent, bg) {
          const out = document.createElement("canvas");
          out.width = destW; out.height = destH;
          const octx = out.getContext("2d");
          if (bg) { octx.fillStyle = bg; octx.fillRect(0, 0, destW, destH); }
          const s = Math.min(maxContent / w, maxContent / h);
          const dw = Math.round(w * s), dh = Math.round(h * s);
          octx.imageSmoothingQuality = "high";
          octx.drawImage(c, minX, minY, w, h, Math.round((destW - dw) / 2), Math.round((destH - dh) / 2), dw, dh);
          return out.toDataURL("image/png").split(",")[1];
        }
        const logoScale = Math.min(1, 600 / Math.max(w, h));
        const lw = Math.round(w * logoScale), lh = Math.round(h * logoScale);
        resolve({
          logo: fit(lw, lh, Math.max(lw, lh), null),
          favicon: fit(64, 64, 60, null),
          touchIcon: fit(180, 180, 150, "#1e2f3f"),
        });
      };
      img.onerror = () => reject(new Error("Could not read that image file"));
      img.src = URL.createObjectURL(file);
    });
  }

  /* ================= HERO & BACKGROUNDS ================= */
  const SPECIAL_SLOTS = [
    ["Homepage hero (computer)", "assets/images/hero/hero-main.jpg", 1920],
    ["Homepage hero (mobile)", "assets/images/hero/hero-main-mobile.jpg", 960],
    ["About page background", "assets/images/backgrounds/about.jpg", 1920],
    ["About background (mobile)", "assets/images/backgrounds/about-mobile.jpg", 960],
    ["Booking page background", "assets/images/backgrounds/booking.jpg", 1920],
    ["Booking background (mobile)", "assets/images/backgrounds/booking-mobile.jpg", 960],
    ["Contact page background", "assets/images/backgrounds/contact.jpg", 1920],
    ["Contact background (mobile)", "assets/images/backgrounds/contact-mobile.jpg", 960],
    ["Facilities page background", "assets/images/backgrounds/facilities.jpg", 1920],
    ["Facilities background (mobile)", "assets/images/backgrounds/facilities-mobile.jpg", 960],
  ];

  async function renderSpecial() {
    panelEl.innerHTML = "";

    /* --- logo --- */
    panelEl.appendChild(el("<h2>Hotel logo</h2>"));
    panelEl.appendChild(el("<p class='hint'>Upload a logo image (a white or transparent background works best — white is removed automatically). The browser-tab icon and the phone home-screen icon are regenerated from it too.</p>"));
    const logoRow = el("<div style='display:flex; align-items:center; gap:16px; flex-wrap:wrap;'></div>");
    const logoPreview = el("<img src='assets/images/logo.png' style='height:60px; background:#eee; border-radius:8px; padding:6px;'>");
    const logoFile = el("<input type='file' accept='image/*' style='display:none;'>");
    const logoBtn = el("<button class='btn' style='margin-top:0;'>Upload new logo</button>");
    logoRow.appendChild(logoPreview); logoRow.appendChild(logoBtn); logoRow.appendChild(logoFile);
    panelEl.appendChild(logoRow);
    logoBtn.addEventListener("click", () => logoFile.click());
    logoFile.addEventListener("change", async () => {
      const file = logoFile.files[0];
      if (!file) return;
      logoBtn.disabled = true;
      try {
        status("busy", "Processing logo…");
        const out = await processLogo(file);
        const targets = [
          ["assets/images/logo.png", out.logo, "Replace logo"],
          ["assets/images/favicon.png", out.favicon, "Regenerate browser-tab icon"],
          ["assets/images/apple-touch-icon.png", out.touchIcon, "Regenerate home-screen icon"],
        ];
        for (const [path, b64, msg] of targets) {
          status("busy", "Uploading " + path.split("/").pop() + "…");
          const existing = await readFile(path);
          await writeFile(path, b64, existing.sha || null, msg);
        }
        logoPreview.src = "data:image/png;base64," + out.logo;
        status("ok", "Logo updated everywhere! Live in about 2 minutes.");
      } catch (e) { status("err", "Logo update failed: " + e.message); }
      logoBtn.disabled = false;
      logoFile.value = "";
    });

    panelEl.appendChild(el("<hr style='border:none; border-top:1px solid var(--stone); margin:22px 0;'>"));
    panelEl.appendChild(el("<h2>Hero &amp; background photos</h2>"));
    panelEl.appendChild(el("<p class='hint'>Replace the homepage hero or a page background. Tip: replace both the computer and mobile versions of the same photo so all visitors see the new one. The photo is resized automatically.</p>"));
    const sel = el("<select></select>");
    SPECIAL_SLOTS.forEach(([label], i) => sel.appendChild(el("<option value='" + i + "'>" + label + "</option>")));
    panelEl.appendChild(el("<label>Which photo?</label>"));
    panelEl.appendChild(sel);
    const preview = el("<img style='max-width:100%; border-radius:8px; margin-top:12px;' loading='lazy'>");
    panelEl.appendChild(preview);
    const fileIn = el("<input type='file' accept='image/*' style='display:none;'>");
    const pick = el("<button class='btn'>Choose a new photo &amp; save</button>");
    panelEl.appendChild(fileIn); panelEl.appendChild(pick);

    const drawPreview = () => (preview.src = SPECIAL_SLOTS[+sel.value][1]);
    sel.addEventListener("change", drawPreview);
    drawPreview();

    pick.addEventListener("click", () => fileIn.click());
    fileIn.addEventListener("change", async () => {
      const file = fileIn.files[0];
      if (!file) return;
      const [label, path, maxDim] = SPECIAL_SLOTS[+sel.value];
      pick.disabled = true;
      try {
        status("busy", "Preparing photo…");
        const base64 = await compressImage(file, maxDim, 0.82);
        status("busy", "Uploading…");
        const existing = await readFile(path);
        await writeFile(path, base64, existing.sha || null, "Replace " + label);
        status("ok", "Saved! The site updates itself in about 2 minutes.");
        preview.src = "data:image/jpeg;base64," + base64;
      } catch (e) { status("err", "Save failed: " + e.message); }
      pick.disabled = false;
      fileIn.value = "";
    });
  }

  /* ================= ROOMS ================= */
  const ROOMS_PATH = "assets/js/data/rooms-data.js";

  async function renderRooms() {
    const { text, sha } = await readTextFile(ROOMS_PATH);
    const data = parseDataFile(text).HR_ROOMS;
    panelEl.innerHTML = "";
    panelEl.appendChild(el("<h2>Rooms</h2>"));
    panelEl.appendChild(el("<p class='hint'>Edit room names, descriptions, and the price line. To show a real price, simply type it in the price line (e.g. \"PKR 8,500 / night\").</p>"));
    data.forEach((room) => {
      const card = el(
        "<div class='item' style='display:block;'>" +
          "<div class='grid2'>" +
            "<div><label>Room name</label><input type='text' class='f-name'></div>" +
            "<div><label>Price line</label><input type='text' class='f-rate'></div>" +
          "</div>" +
          "<label>Description</label><textarea class='f-desc'></textarea>" +
        "</div>"
      );
      card.querySelector(".f-name").value = room.name;
      card.querySelector(".f-name").addEventListener("input", (e) => (room.name = e.target.value));
      card.querySelector(".f-rate").value = room.rateNote;
      card.querySelector(".f-rate").addEventListener("input", (e) => (room.rateNote = e.target.value));
      card.querySelector(".f-desc").value = room.description;
      card.querySelector(".f-desc").addEventListener("input", (e) => (room.description = e.target.value));
      panelEl.appendChild(card);
    });
    const saveBtn = el("<button class='btn'>Save rooms</button>");
    saveBtn.addEventListener("click", async () => {
      saveBtn.disabled = true;
      try {
        status("busy", "Saving…");
        await writeTextFile(ROOMS_PATH, serializeDataFile("HR_ROOMS", data), sha, "Update rooms");
        status("ok", "Saved! The site updates itself in about 2 minutes.");
      } catch (e) { status("err", "Save failed: " + e.message); }
      saveBtn.disabled = false;
    });
    panelEl.appendChild(saveBtn);
  }

  /* ================= REVIEWS ================= */
  const REVIEWS_PATH = "assets/js/data/reviews-data.js";

  async function renderReviews() {
    const { text, sha } = await readTextFile(REVIEWS_PATH);
    const data = parseDataFile(text).HR_REVIEWS;
    panelEl.innerHTML = "";
    panelEl.appendChild(el("<h2>Guest reviews</h2>"));
    panelEl.appendChild(el("<p class='hint'>The star average on the homepage recalculates automatically.</p>"));
    const list = el("<div></div>");
    panelEl.appendChild(list);

    function draw() {
      list.innerHTML = "";
      data.forEach((rev, i) => {
        const card = el(
          "<div class='item' style='display:block;'>" +
            "<div class='grid2'>" +
              "<div><label>Guest name</label><input type='text' class='f-name'></div>" +
              "<div><label>Stars</label><select class='f-rating'><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div>" +
            "</div>" +
            "<label>Context (e.g. \"Family stay, 3 nights\")</label><input type='text' class='f-ctx'>" +
            "<label>Review text</label><textarea class='f-quote'></textarea>" +
            "<button class='btn danger' style='margin-top:10px;'>Delete this review</button>" +
          "</div>"
        );
        card.querySelector(".f-name").value = rev.name;
        card.querySelector(".f-name").addEventListener("input", (e) => (rev.name = e.target.value));
        card.querySelector(".f-rating").value = String(rev.rating);
        card.querySelector(".f-rating").addEventListener("change", (e) => (rev.rating = +e.target.value));
        card.querySelector(".f-ctx").value = rev.context;
        card.querySelector(".f-ctx").addEventListener("input", (e) => (rev.context = e.target.value));
        card.querySelector(".f-quote").value = rev.quote;
        card.querySelector(".f-quote").addEventListener("input", (e) => (rev.quote = e.target.value));
        card.querySelector(".btn.danger").addEventListener("click", () => {
          if (confirm("Delete the review by " + rev.name + "?")) { data.splice(i, 1); draw(); }
        });
        list.appendChild(card);
      });
    }
    draw();

    const addBtn = el("<button class='btn secondary'>+ Add a review</button>");
    addBtn.addEventListener("click", () => { data.push({ name: "", rating: 5, context: "", quote: "" }); draw(); });
    panelEl.appendChild(addBtn);

    const saveBtn = el("<button class='btn' style='margin-left:8px;'>Save reviews</button>");
    saveBtn.addEventListener("click", async () => {
      saveBtn.disabled = true;
      try {
        status("busy", "Saving…");
        await writeTextFile(REVIEWS_PATH, serializeDataFile("HR_REVIEWS", data), sha, "Update reviews");
        status("ok", "Saved! The site updates itself in about 2 minutes.");
      } catch (e) { status("err", "Save failed: " + e.message); }
      saveBtn.disabled = false;
    });
    panelEl.appendChild(saveBtn);
  }

  /* ================= WEBSITE TEXT ================= */
  const EN_PATH = "assets/js/i18n/en.js";
  const SECTION_LABELS = {
    common: "Buttons & common labels", nav: "Menu", footer: "Footer",
    home: "Home page", rooms: "Rooms page", booking: "Booking form",
    bookingPage: "Booking page", gallery: "Gallery page", about: "About page",
    facilities: "Facilities list", facilitiesPage: "Facilities page",
    attractions: "Attraction descriptions", attractionsPage: "Attractions page",
    contactPage: "Contact page", reviews: "Reviews section",
  };
  const prettyKey = (k) =>
    k.replace(/([a-z])([A-Z])/g, "$1 $2").replace(/^./, (c) => c.toUpperCase());

  async function renderText() {
    const { text, sha } = await readTextFile(EN_PATH);
    const dict = parseDataFile(text).HR_I18N.en;

    panelEl.innerHTML = "";
    panelEl.appendChild(el("<h2>Website text</h2>"));
    panelEl.appendChild(el("<p class='hint'>Every heading, paragraph, and label on the site, grouped by page. <strong>This edits the English text only</strong> — the other 8 languages keep their existing translations until they are updated separately.</p>"));

    function addFields(container, obj) {
      for (const key of Object.keys(obj)) {
        const val = obj[key];
        if (typeof val === "string") {
          container.appendChild(el("<label>" + prettyKey(key) + "</label>"));
          const field = val.length > 70 ? el("<textarea></textarea>") : el("<input type='text'>");
          field.value = val;
          field.addEventListener("input", (e) => (obj[key] = e.target.value));
          container.appendChild(field);
        } else if (val && typeof val === "object") {
          addFields(container, val); // arrays and nested groups flatten into the same section
        }
      }
    }

    for (const section of Object.keys(dict)) {
      if (section === "meta") continue;
      const box = el("<details style='border:1px solid var(--stone); border-radius:10px; padding:10px 14px; margin-bottom:10px;'><summary style='cursor:pointer; font-weight:700; font-size:14px;'>" + (SECTION_LABELS[section] || prettyKey(section)) + "</summary></details>");
      addFields(box, dict[section]);
      panelEl.appendChild(box);
    }

    const saveBtn = el("<button class='btn'>Save text changes</button>");
    saveBtn.addEventListener("click", async () => {
      saveBtn.disabled = true;
      try {
        status("busy", "Saving…");
        const out = "window.HR_I18N = window.HR_I18N || {};\nwindow.HR_I18N.en = " + JSON.stringify(dict, null, 2) + ";\n";
        await writeTextFile(EN_PATH, out, sha, "Update website text");
        status("ok", "Saved! The site updates itself in about 2 minutes.");
      } catch (e) { status("err", "Save failed: " + e.message); }
      saveBtn.disabled = false;
    });
    panelEl.appendChild(saveBtn);
  }

  /* ================= CONTACT INFO ================= */
  const PAGES = ["index.html", "rooms.html", "booking.html", "gallery.html", "about.html", "facilities.html", "attractions.html", "contact.html"];

  function phoneForms(digits) {
    // digits like "923555014433"
    return {
      digits,
      display: "+92 " + digits.slice(2, 5) + " " + digits.slice(5),
      dashed: "+92-" + digits.slice(2, 5) + "-" + digits.slice(5),
      tel: "+" + digits,
    };
  }

  async function renderContact() {
    const { text: indexText } = await readTextFile("index.html");
    const curDigits = (indexText.match(/wa\.me\/(\d+)/) || [])[1] || "";
    const curEmail = (indexText.match(/to=([\w.+-]+@[\w.-]+)/) || [])[1] || "";
    const curFb = (indexText.match(/https:\/\/www\.facebook\.com\/[\w.]+/) || [])[0] || "";

    panelEl.innerHTML = "";
    panelEl.appendChild(el("<h2>Contact information</h2>"));
    panelEl.appendChild(el("<p class='hint'>Updates the phone, WhatsApp, email, and Facebook link across every page of the site at once. Phone and WhatsApp use the same number.</p>"));
    panelEl.appendChild(el("<label>Phone / WhatsApp number (digits only, starting 92)</label>"));
    const inPhone = el("<input type='text' placeholder='923555014433'>");
    inPhone.value = curDigits;
    panelEl.appendChild(inPhone);
    panelEl.appendChild(el("<label>Email address</label>"));
    const inEmail = el("<input type='text'>");
    inEmail.value = curEmail;
    panelEl.appendChild(inEmail);
    panelEl.appendChild(el("<label>Facebook page address</label>"));
    const inFb = el("<input type='url'>");
    inFb.value = curFb;
    panelEl.appendChild(inFb);

    const saveBtn = el("<button class='btn'>Update everywhere</button>");
    panelEl.appendChild(saveBtn);
    const report = el("<div class='preview-box' style='display:none;'></div>");
    panelEl.appendChild(report);

    saveBtn.addEventListener("click", async () => {
      const newDigits = inPhone.value.replace(/\D/g, "");
      const newEmail = inEmail.value.trim();
      const newFb = inFb.value.trim().replace(/\/$/, "");
      if (!/^92\d{9,11}$/.test(newDigits)) { status("err", "The phone number should be digits only and start with 92."); return; }
      if (!/^[\w.+-]+@[\w.-]+\.\w+$/.test(newEmail)) { status("err", "That email address doesn't look right."); return; }
      if (!/^https:\/\/www\.facebook\.com\/[\w.]+$/.test(newFb)) { status("err", "The Facebook address should look like https://www.facebook.com/YourPage"); return; }
      if (!confirm("Update contact details across all 8 pages?")) return;

      const o = phoneForms(curDigits), n = phoneForms(newDigits);
      const pairs = [
        [o.display, n.display], [o.dashed, n.dashed], ["wa.me/" + o.digits, "wa.me/" + n.digits],
        ["tel:" + o.tel, "tel:" + n.tel], [curEmail, newEmail], [curFb, newFb],
      ].filter(([a, b]) => a && a !== b);
      if (!pairs.length) { status("ok", "Nothing changed."); return; }

      saveBtn.disabled = true;
      const lines = [];
      try {
        for (const page of PAGES.concat("assets/js/site-config.js")) {
          status("busy", "Updating " + page + "…");
          const { text, sha } = await readTextFile(page);
          let updated = text, count = 0;
          for (const [from, to] of pairs) {
            const parts = updated.split(from);
            count += parts.length - 1;
            updated = parts.join(to);
          }
          if (count > 0) {
            await writeTextFile(page, updated, sha, "Update contact info");
            lines.push(page + ": " + count + " place(s) updated");
          }
        }
        report.style.display = "";
        report.textContent = lines.join("\n") || "No matches found — nothing needed changing.";
        status("ok", "Contact info updated! Live in about 2 minutes.");
        setTimeout(() => openTab("contact"), 1500);
      } catch (e) {
        status("err", "Update failed partway: " + e.message + " — press Update again to finish the rest.");
      }
      saveBtn.disabled = false;
    });
  }

  /* ---------- boot ---------- */
  if (store.gateway && store.pass) {
    gw("GET", null).then(showApp).catch(() => {});
  }
})();
</script>
</body>
</html>
